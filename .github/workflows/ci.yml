name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: make pretty-check

      - name: Run lint
        run: make lint

      - name: Compile Python sources
        run: make compile

      - name: Validate skill metadata
        run: make validate-skill

      - name: Run tests
        run: make test-all

      - name: Generate coverage artifacts
        run: make coverage-html

      - name: Generate example report
        run: make report-example

      - name: Package HTML coverage for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: htmlcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  deploy-coverage:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy HTML coverage to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
